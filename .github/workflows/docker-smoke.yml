# Builds the headless daemon image and runs docker/smoke.sh against it. Never pushes. Separate from release.yml.
name: docker-smoke
on:
  pull_request:
    paths: ['docker/**', '.github/workflows/docker-smoke.yml']
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Docker context
        run: ./gradlew --no-daemon :superiorSoftLibrary:infantry:dockerContext
      - name: Build the image
        run: docker build -t infantryai/infantry-ai:dev superiorSoftLibrary/infantry/build/docker
      - name: Validate compose.yaml
        run: |
          mkdir -p /tmp/s && echo x > /tmp/s/infantry_token && echo x > /tmp/s/infantry_keystore_key
          INFANTRY_SECRETS_DIR=/tmp/s docker compose -f docker/compose.yaml config -q
      - name: Smoke test
        run: docker/smoke.sh infantryai/infantry-ai:dev
