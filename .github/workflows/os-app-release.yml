# BOS-PUB-0: Infantry AI as an app of BattalionOS (.bosapp).
#
# A tag os-app-v<version> (or a manual run) builds the daemon LIBRARY (infantry_distribution.dll, the infantry-distribution
# cdylib; the package holds no daemon program), the CLI, the staged plugins and the shell, packs them with
# scripts/bos-package.py, checks that no native file imports the dynamic VC++ runtime (scripts/bos-crt-check.py), signs
# the package, and makes the GitHub release os-app-v<version> holding the .bosapp, its .sig, feed.json,
# catalog-entry.json and public.key.
#
# Rules that keep the standalone app's updater safe (a workflow-text test pins them):
#   1. The release is a PRERELEASE and never latest (`gh release create --prerelease --latest=false`): this repo's "latest"
#      release is what every standalone updater reads (rust-promote.yml), so a package must never become it.
#   2. No latest.json is uploaded: that name is the Tauri updater manifest. The OS app's feed is feed.json.
#   3. Nothing here pushes a feed, a branch or the catalog. The channel feed (release bos-stable / bos-nightly) is moved
#      by hand after the release is tested: scripts/bos-feed.py rebuilds it from the release's own assets and refuses a
#      mismatch; the commands are in the BOS-PUB-0 done comment.
#
# Signing: the SAME secrets rust-release.yml uses, TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the
# private half of plugins.updater.pubkey in app/src-tauri/tauri.conf.json, which is the key the catalog pins. They exist
# in CI only. bos-package.py --tauri-sign unwraps what `tauri signer sign` writes (base64) into the plain minisig text the
# OS verifies (battalion-host armory/package.rs), and verifies it against the pinned key before it writes anything.
# A tag run REQUIRES the secrets; a manual run without them is signed with a THROWAWAY key and says so (not trusted).
name: os-app-release

on:
  push:
    tags: ['os-app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to pack (default is the one in app/src-tauri/tauri.conf.json)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: os-app-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults: { run: { shell: bash } }
    # SITES-ENV-1: prod for EVERY step. Set on one step only, "Stage the plugins" ran without it and shipped Infantry_Sites
    # with staging endpoints (127.0.0.1:18953) in 0.8.4 and 0.8.5. The guard bundled_plugins.rs checks this.
    env: { INFANTRY_BUILD_ENV: prod }
    steps:
      - uses: actions/checkout@v4
      - name: "Checkout the infantry-plugins repo (bundled-external.json plugins are built from it)"
        uses: actions/checkout@v4
        with: { repository: SuperiorSoft-LLC/infantry-plugins, path: infantry-plugins, token: '${{ secrets.INFANTRY_PLUGINS_TOKEN || github.token }}' }
      - run: echo "INFANTRY_PLUGINS_REPO=$GITHUB_WORKSPACE/infantry-plugins" >> "$GITHUB_ENV"
      - name: Version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#os-app-v}"; else v="${{ inputs.version }}"; fi
          if [ -z "$v" ]; then v="$(python -c 'import json;print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2 }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build the shell
        working-directory: app
        run: pnpm build
      - name: Build the daemon library and the CLI
        working-directory: rust
        env: { CARGO_BUILD_JOBS: '4' }
        run: cargo build --release -p infantry-distribution -p infantry-cli
      - name: Stage the plugins
        run: bash rust/plugins/stage.sh "$RUNNER_TEMP/plugins" release
      - name: The staged plugins carry no local or staging endpoint
        run: |
          set -euo pipefail
          bad="$(grep -rlE '127\.0\.0\.1|localhost|\(staging\)' --include=module.json "$RUNNER_TEMP/plugins" || true)"
          if [ -n "$bad" ]; then echo "::error::staged module.json with a local or staging endpoint:"; echo "$bad"; exit 1; fi
      - name: Check the VC++ runtime (a clean Windows has none)
        run: |
          set -euo pipefail
          target="$(cd rust && cargo metadata --format-version 1 --no-deps | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          python scripts/bos-crt-check.py "$target/release/infantry_distribution.dll" "$target/release/infantry.exe"
      - name: Pack, check and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          pip install cryptography
          target="$(cd rust && cargo metadata --format-version 1 --no-deps | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          args=(--library "$target/release/infantry_distribution.dll" --cli "$target/release/infantry.exe"
                --plugins "$RUNNER_TEMP/plugins" --dist app/shell/dist --version "$VERSION" --out dist-bosapp
                --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/os-app-v${VERSION}/")
          # docs/os-app-release-notes.md holds the owner-facing notes when its first line names this version
          if head -n1 docs/os-app-release-notes.md 2>/dev/null | grep -qF "Infantry AI $VERSION "; then notes="$(cat docs/os-app-release-notes.md)"; else notes="Infantry AI $VERSION as a BattalionOS app."; fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--tauri-sign)
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::A tag run needs the TAURI_SIGNING_PRIVATE_KEY secret (the key whose public half the catalog pins)"; exit 1
          else
            notes="$notes SIGNED WITH A THROWAWAY KEY: not trusted by a real install."
          fi
          python scripts/bos-package.py "${args[@]}" --notes "$notes"
          rm -f dist-bosapp/throwaway.key.json
          # the release's own assets must agree with the feed (sha256, size, signature, url) and verify against the key
          python scripts/bos-feed.py --assets dist-bosapp --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/feed.check.json" --pubkey "$(cat dist-bosapp/public.key)"
      - uses: actions/upload-artifact@v4
        with: { name: os-app, path: dist-bosapp/*, if-no-files-found: error }

  draft:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: os-app, path: dist-bosapp }
      - name: Release (prerelease, never latest, no updater manifest)
        run: |
          set -euo pipefail
          v="$(python3 -c 'import json;print(json.load(open("dist-bosapp/feed.json"))["version"])')"
          tag="os-app-v$v"
          files=(dist-bosapp/*.bosapp dist-bosapp/*.bosapp.sig dist-bosapp/feed.json dist-bosapp/catalog-entry.json dist-bosapp/public.key)
          gh release create "$tag" "${files[@]}" --prerelease --latest=false --title "Infantry AI $v (BattalionOS app)" \
            --notes "$(python3 -c 'import json;print(json.load(open("dist-bosapp/feed.json")).get("notes",""))')"
