# RELEASE-AUTO-1: pushing a tag v<MAJOR.MINOR.BUILD> builds the Windows MSI (+ app-image zip), the Android APK, the web
# bundle zip and the headless server archives (Linux, Windows, macOS), then publishes them with SHA256SUMS and latest.json
# to that tag's GitHub Release. See docs/RELEASING.md.
# RELEASE-PLATFORMS-1: macOS is a BETA and optional: the macos desktop job and the macos-15 headless leg are
# continue-on-error, and the release publishes whatever macOS assets succeeded. Windows, Android, web and the
# linux-x64 / windows-x64 server archives stay required (the release job checks each file).
# NIGHTLY-1: the same jobs build the nightly. .github/workflows/nightly.yml calls this workflow (workflow_call) with a planned
# version (scripts/nightly-version.sh); it then builds that dev-branch commit and publishes a GitHub PRERELEASE (never
# "latest") with SHA256SUMS and nightly.json. A stable tag must pass the safety guard first (scripts/stable-guard.sh: the
# commit was shipped as a nightly). Nightly tags never start this workflow on push (they are created by the release itself
# with the workflow token, and excluded below anyway).
name: release

on:
  push:
    tags: ['v*', '!v*-nightly.*']
  workflow_call:
    inputs:
      ref:
        description: The commit to build (a full sha).
        type: string
        required: true
      version:
        description: The app version, a SemVer with a pre-release (1.0.8-nightly.20261107.12).
        type: string
        required: true
      package_version:
        description: The numeric MSI/DMG version, unique per build (1.0.40012).
        type: string
        required: true
      tag:
        description: The release tag to create on ref (v<version>).
        type: string
        required: true
      channel:
        description: The update channel id the release belongs to (the pre-release identifier, e.g. nightly).
        type: string
        required: true
      branch:
        description: The branch ref is the head of (the packaging guard accepts only the dev branch or a v* tag).
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
  JAVA_VERSION: '21'
  # UPDATER-DEFAULT-1: every gradlew of this workflow bakes this repository into the Updater's manifest (Gradle property
  # infantryUpdateRepo over module.json update.repo), so an installed release checks the releases it came from, fork or not.
  ORG_GRADLE_PROJECT_infantryUpdateRepo: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      package_version: ${{ steps.v.outputs.package_version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      channel: ${{ steps.v.outputs.channel }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # NIGHTLY-1: the stable guard reads the history and the nightly tags
      - id: v
        name: Version (stable - the tag must equal infantryVersion; nightly - the caller's planned version)
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PACKAGE: ${{ inputs.package_version }}
          IN_TAG: ${{ inputs.tag }}
          IN_REF: ${{ inputs.ref }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION:-}" ]; then
            # NIGHTLY-1: called by nightly.yml (scripts/nightly-version.sh planned these).
            [[ "$IN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$ ]] || { echo "version '$IN_VERSION' has no pre-release"; exit 1; }
            [[ "$IN_PACKAGE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package_version '$IN_PACKAGE' is not MAJOR.MINOR.BUILD"; exit 1; }
            [ "$IN_TAG" = "v$IN_VERSION" ] || { echo "tag '$IN_TAG' is not v$IN_VERSION"; exit 1; }
            [[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref '$IN_REF' is not a full commit sha"; exit 1; }
            [[ "$IN_CHANNEL" =~ ^[a-z][a-z0-9-]*$ && "$IN_CHANNEL" != stable ]] || { echo "channel '$IN_CHANNEL' is not a prerelease channel id"; exit 1; }
            [ -n "$IN_BRANCH" ] || { echo "no branch"; exit 1; }
            { echo "version=$IN_VERSION"; echo "package_version=$IN_PACKAGE"; echo "tag=$IN_TAG"; echo "ref=$IN_REF"
              echo "channel=$IN_CHANNEL"; echo "branch=$IN_BRANCH"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declared="$(sed -n 's/^infantryVersion=\(.*\)$/\1/p' gradle.properties | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          [[ "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "gradle.properties infantryVersion='$declared' is not MAJOR.MINOR.BUILD"; exit 1; }
          [[ "$declared" == "$tag" ]] || { echo "tag $GITHUB_REF_NAME does not match infantryVersion=$declared"; exit 1; }
          # NIGHTLY-1: a stable BUILD stays below the nightly MSI range (the script's own check, with a stand-in date and run).
          scripts/nightly-version.sh compute "$declared" none 20000101 1 >/dev/null
          { echo "version=$declared"; echo "package_version=$declared"; echo "tag=$GITHUB_REF_NAME"; echo "ref="
            echo "channel=stable"; echo "branch="; } >> "$GITHUB_OUTPUT"
      # NIGHTLY-1 safety guard: a stable release ships only a commit that was shipped as a nightly first (or its release bump).
      # Override: an ANNOTATED tag whose message has a line `force-stable: <reason>` (docs/RELEASING.md).
      - name: Stable safety guard (shipped as a nightly first)
        if: ${{ steps.v.outputs.channel == 'stable' }}
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"   # the annotated tag object, with its message
          forced="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | grep -m1 'force-stable:' || true)"
          if [ -n "$forced" ]; then echo "::warning::stable safety guard OVERRIDDEN by the tag message: $forced"; exit 0; fi
          scripts/stable-guard.sh "$GITHUB_SHA"

  windows:
    needs: version
    runs-on: windows-2022   # pinned: ships WiX 3.x, which jpackage needs for MSI
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      - name: Build MSI and app-image
        shell: bash
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          P='${{ needs.version.outputs.package_version }}'   # NIGHTLY-1: the MSI's numeric version (= V on a stable release)
          ./gradlew --no-daemon :superiorSoftLibrary:infantryUi:createDistributable -PinfantryVersion="$V" -PinfantryPackageVersion="$P" $IHQ_SIGN
          # UPDATER-1: outside the checkout, or the packaging guard (clean tree) refuses releaseAssets and the MSI is skipped.
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          app="$(ls -d superiorSoftLibrary/infantryUi/build/compose/binaries/main/app/InfantryAI)"
          # UPDATER-1 gate: no new package of ours split over two jars of the app (docs/RELEASING.md).
          scripts/split-packages.sh "$app/app"
          (cd "$(dirname "$app")" && 7z a -tzip "$out/InfantryAI-$V-windows.zip" InfantryAI >/dev/null)
          if ./gradlew --no-daemon :superiorSoftLibrary:infantryUi:releaseAssets -PinfantryVersion="$V" -PinfantryPackageVersion="$P" $IHQ_SIGN; then
            cp "superiorSoftLibrary/infantryUi/build/release/$P/InfantryAI-$P.msi" "$out/InfantryAI-$V.msi"
          else
            echo "::warning::MSI packaging failed unsigned on this runner; publishing the app-image zip only (the in-app updater needs the MSI)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KEYSTORE_B64: ${{ secrets.INFANTRY_ANDROID_RELEASE_KEYSTORE_BASE64 }}
      INFANTRY_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.INFANTRY_ANDROID_RELEASE_STORE_PASSWORD }}
      INFANTRY_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.INFANTRY_ANDROID_RELEASE_KEY_ALIAS }}
      INFANTRY_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.INFANTRY_ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The ubuntu runner already ships an Android SDK (ANDROID_HOME); setup-android's default `tools` package no longer exists in
      # cmdline-tools 16. Accept licenses and let AGP download the platform/build-tools it needs.
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      - name: Build APK (signed if the keystore secrets exist, else debug)
        shell: bash
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          mkdir -p out
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${INFANTRY_ANDROID_RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${INFANTRY_ANDROID_RELEASE_KEY_ALIAS:-}" ] && [ -n "${INFANTRY_ANDROID_RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export INFANTRY_ANDROID_RELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew --no-daemon :superiorSoftLibrary:infantryAndroid:assembleRelease -PinfantryVersion="$V" $IHQ_SIGN
            apk="$(ls superiorSoftLibrary/infantryAndroid/build/outputs/apk/release/*.apk | head -n1)"
            case "$apk" in *unsigned*) echo "release APK came out unsigned"; exit 1;; esac
            cp "$apk" "out/InfantryAI-$V.apk"
          else
            echo "::warning::No release keystore secrets; building a DEBUG-signed APK. Updates over an installed build need a stable key."
            ./gradlew --no-daemon :superiorSoftLibrary:infantryAndroid:assembleDebug -PinfantryVersion="$V" $IHQ_SIGN
            apk="$(ls superiorSoftLibrary/infantryAndroid/build/outputs/apk/debug/*.apk | head -n1)"
            cp "$apk" "out/InfantryAI-$V-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # HEADLESS-DIST-1: the headless server download (daemon + CLI + a bundled Java runtime), one archive per OS.
  headless:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (arm64): standard runner, free on a public repo (a private repo's plan refused it, 2026-11-06 v1.0.4).
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    # RELEASE-PLATFORMS-1: the macOS leg is beta; its failure never fails the run, the release just ships without it.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      - name: Build the headless server archive
        shell: bash
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          ./gradlew --no-daemon :superiorSoftLibrary:infantry:headlessDist -PinfantryVersion="$V" $IHQ_SIGN
          mkdir -p out
          cp superiorSoftLibrary/infantry/build/distributions/InfantryAI-server-"$V"-* out/
      # UPDATER-1 gate: an archive is published only when it starts (/health 200, no refused plugin) and has no new split
      # package. A free port and a throwaway state dir; the runner's INFANTRY_* never reach it (docs/RELEASING.md).
      - name: Smoke-test the server archive
        shell: bash
        run: |
          set -euo pipefail
          for f in out/InfantryAI-server-*; do scripts/release-smoke.sh "$f" 240; done
      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  # RELEASE-PLATFORMS-1: the macOS (beta) desktop app, an arm64 .dmg (MACOS-DMG-2: hdiutil, not jpackage) on macos-15.
  # Ad-hoc signed only, un-notarized (no Apple certificate yet), so the asset name says beta and users clear the quarantine flag
  # by hand (docs/RELEASING.md). Optional: continue-on-error, and the release publishes without it.
  macos:
    needs: version
    runs-on: macos-15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      # MACOS-DMG-2: no jpackage packageDmg. v1.0.14 showed jpackage's own ad-hoc `codesign -s -` of the finished .app exits 1,
      # and jpackage never prints codesign's stderr. So: createDistributable (the .app; that works), strip extended attributes,
      # ad-hoc sign it OURSELVES with the output visible (and as ::error:: annotations, readable through the public API without
      # auth), then build the .dmg with hdiutil. Still no Developer ID, no Apple account, no secrets: arm64 only needs an
      # ad-hoc signature to run.
      - name: Build the ad-hoc signed .dmg (arm64)
        shell: bash
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          [ "$(uname -m)" = "arm64" ] || { echo "expected an arm64 runner, got $(uname -m); the asset name would lie" >&2; exit 1; }
          gw() { ./gradlew --no-daemon "$@" -PinfantryVersion="$V" -PinfantryPackageVersion='${{ needs.version.outputs.package_version }}' $IHQ_SIGN; }
          gw :superiorSoftLibrary:infantryUi:createDistributable
          app="$(find superiorSoftLibrary/infantryUi/build/compose/binaries -type d -path '*/app/*.app' -prune | head -n1)"
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::createDistributable left no .app under superiorSoftLibrary/infantryUi/build/compose/binaries/**/app/" >&2; exit 1; }
          echo "app bundle: $app"
          # MACOS-DMG-3: macOS allows only Contents/ at the bundle root (else codesign: "unsealed contents present in the bundle
          # root"). Show the root as a notice, and fail early with the stray names, so a regression is plain in the annotations.
          root="$(ls -A "$app" | paste -sd' ' -)"
          echo "::notice title=bundle root::$(basename "$app")/: $root"
          stray="$(ls -A "$app" | grep -vx 'Contents' | paste -sd' ' - || true)"
          [ -z "$stray" ] || { echo "::error title=stray files in the bundle root::$(basename "$app")/ holds $stray next to Contents/ (move them under Contents/)"; exit 1; }
          # UPDATER-1 gate: no new package of ours split over two jars of the app (docs/RELEASING.md).
          scripts/split-packages.sh "$app/Contents/app"
          # Extended attributes ("resource fork, Finder information, or similar detritus not allowed") break codesign.
          xattr -cr "$app"
          log="$RUNNER_TEMP/codesign.log"
          # GitHub annotations are one line each: encode %, CR and LF; keep the lines that name a problem (else the tail).
          annotate() {
            local title="$1" body
            body="$(grep -iE 'error|fail|not allowed|invalid|unsealed|detritus|code object|resource' "$log" | tail -n 25 || true)"
            [ -n "$body" ] || body="$(tail -n 25 "$log")"
            body="${body//'%'/'%25'}"; body="${body//$'\r'/'%0D'}"; body="${body//$'\n'/'%0A'}"
            echo "::error title=$title::$body"
          }
          sign_app() { codesign --force --deep -s - -vvvv "$app" >"$log" 2>&1; }
          if ! sign_app; then
            echo "::group::codesign output (first try)"; cat "$log"; echo "::endgroup::"
            annotate "codesign --deep failed (first try)"
            # Second try, inside out: ad-hoc sign every nested Mach-O (dylib, jnilib, executables) on its own, then the bundle.
            # The failing file shows up in the output above / the annotation either way.
            find "$app/Contents" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign --force -s - "$f" 2>&1 | sed "s|^|nested: |" || echo "::warning::could not ad-hoc sign $f"
              fi
            done
            if ! sign_app; then
              echo "::group::codesign output (second try)"; cat "$log"; echo "::endgroup::"
              annotate "codesign failed after signing nested code"
              exit 1
            fi
          fi
          cat "$log" | tail -n 20
          codesign --verify --deep --strict -vv "$app" 2>&1 | tee "$log" || { annotate "codesign --verify failed"; exit 1; }
          codesign -dv "$app" 2>&1 | head -n 6 || true
          # The .dmg: the app plus an /Applications symlink, compressed (UDZO). ditto keeps the signature and modes intact.
          stage="$RUNNER_TEMP/dmg-stage"; rm -rf "$stage"; mkdir -p "$stage"
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          # Outside the checkout, like the windows job: the packaging guard wants a clean tree.
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          dmg="$out/InfantryAI-$V-macos-arm64-beta.dmg"
          # hdiutil is known to fail on hosted runners with "Resource busy": retry once.
          for attempt in 1 2; do
            if hdiutil create -volname "Infantry AI" -srcfolder "$stage" -ov -format UDZO "$dmg" >"$log" 2>&1; then cat "$log"; break; fi
            cat "$log"
            [ "$attempt" = 2 ] && { annotate "hdiutil create failed twice"; exit 1; }
            sleep 10
          done
          hdiutil verify "$dmg"
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  # RELEASE-PLATFORMS-1: the browser client's production bundle (:infantryWeb:assembleWeb, WEB-1), the same files the daemon
  # serves at / from its web/ folder. Not a packaging task, so the packaging guard does not apply.
  web:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      - name: Build the web bundle zip
        shell: bash
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          ./gradlew --no-daemon :superiorSoftLibrary:infantryWeb:assembleWeb -PinfantryVersion="$V" $IHQ_SIGN
          out="$RUNNER_TEMP/out"; stage="$RUNNER_TEMP/web/InfantryAI-web-$V"; mkdir -p "$out" "$stage"
          cp -R superiorSoftLibrary/infantryWeb/build/assembleWeb/. "$stage/"
          for f in index.html infantryWeb.mjs; do [ -f "$stage/$f" ] || { echo "web bundle has no $f" >&2; exit 1; }; done
          (cd "$RUNNER_TEMP/web" && zip -qr "$out/InfantryAI-web-$V.zip" "InfantryAI-web-$V")
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    # RELEASE-PLATFORMS-1: runs after every build job, even a failed optional macOS one. The required jobs are checked
    # here, their files and the required server archives in the first step.
    needs: [version, windows, android, headless, web, macos]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.windows.result == 'success'
      && needs.android.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: SHA256SUMS and the channel index (latest.json, or nightly.json for a nightly)
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          index=latest.json; [ "$CHANNEL" = stable ] || index="$CHANNEL.json"
          cd dl
          ls -l
          sha256sum InfantryAI-* > SHA256SUMS
          # RELEASE-PLATFORMS-1: the required assets. $1 is a glob, left unquoted on purpose.
          need() { ls $1 >/dev/null 2>&1 || { echo "release is missing $2 ($1)" >&2; exit 1; }; }
          need "InfantryAI-$V-windows.zip" "the Windows app image"
          need "InfantryAI-$V*.apk" "the Android APK"
          need "InfantryAI-web-$V.zip" "the web bundle"
          [ -f "InfantryAI-$V.msi" ] || echo "::warning::no MSI on this release: the Windows in-app updater has nothing to install"
          [ -f "InfantryAI-$V-macos-arm64-beta.dmg" ] || echo "::warning::the macOS (beta) .dmg did not build; publishing without it"
          # SERVER-UPDATE-5: the headless updater refuses an archive that has no SHA256SUMS line, so a release must carry
          # every required server archive AND list each one. macos-arm64 is beta: listed when it built, else a warning
          # (a macOS server then reports no archive for macos-arm64 and keeps running; no other platform looks at it).
          for p in linux-x64 windows-x64 macos-arm64; do
            f="$(ls InfantryAI-server-"$V"-"$p".* 2>/dev/null | head -n1 || true)"
            if [ -z "$f" ]; then
              if [ "$p" = macos-arm64 ]; then echo "::warning::the macOS (beta) server archive did not build; publishing without it"; continue; fi
              echo "release is missing the server archive for $p" >&2; exit 1
            fi
            grep -qF "$f" SHA256SUMS || { echo "SHA256SUMS has no line for $f" >&2; exit 1; }
          done
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          assets="$(for f in InfantryAI-*; do
            jq -n --arg n "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" --argjson z "$(stat -c %s "$f")" --arg u "$base/$f" \
              '{name:$n, sha256:$s, size:$z, url:$u}'
          done | jq -s .)"
          jq -n --arg v "$V" --arg t "$TAG" --arg d "$(date -u +%FT%TZ)" --argjson a "$assets" \
            '{version:$v, tag:$t, published:$d, assets:$a}' > "$index"
          cat "$index"
      # UPDATER-1: an ed25519 signature of SHA256SUMS (SHA256SUMS.sig, base64 of the 64 raw bytes), so a client that pins
      # the public key trusts the hashes and not only the host. The private key lives ONLY in the Actions secret
      # INFANTRY_RELEASE_SIGNING_KEY (PEM, or base64 of the PEM); it is written to the runner's temp dir, used, and deleted.
      # No secret: the release goes out unsigned with a warning. Repo variable INFANTRY_RELEASE_PUBLIC_KEY (base64 of the
      # 32-byte public key) set: the signature must verify against it, so a wrong key in the secret fails the release.
      - name: Sign SHA256SUMS (ed25519)
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.INFANTRY_RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.INFANTRY_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cd dl
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::No INFANTRY_RELEASE_SIGNING_KEY secret: SHA256SUMS is published UNSIGNED (no SHA256SUMS.sig). See docs/RELEASING.md."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing.pem"; pub="$RUNNER_TEMP/release-signing.pub.pem"
          trap 'rm -f "$key" "$pub" "$RUNNER_TEMP/sig.bin"' EXIT
          if printf '%s' "$RELEASE_SIGNING_KEY" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          else printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$key"; fi
          openssl pkey -in "$key" -noout -text 2>/dev/null | grep -qi 'ED25519' || { echo "INFANTRY_RELEASE_SIGNING_KEY is not an ed25519 private key" >&2; exit 1; }
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out "$RUNNER_TEMP/sig.bin"
          openssl pkey -in "$key" -pubout -out "$pub"
          openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in SHA256SUMS -sigfile "$RUNNER_TEMP/sig.bin" >/dev/null
          derived="$(openssl pkey -pubin -in "$pub" -outform DER | tail -c 32 | base64 -w0)"
          if [ -n "${RELEASE_PUBLIC_KEY:-}" ] && [ "$derived" != "$RELEASE_PUBLIC_KEY" ]; then
            echo "the signing key does not match the pinned INFANTRY_RELEASE_PUBLIC_KEY" >&2; exit 1
          fi
          base64 -w0 "$RUNNER_TEMP/sig.bin" > SHA256SUMS.sig
          echo "SHA256SUMS signed; public key (base64): $derived"
      - name: Create or update the GitHub Release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          SHA: ${{ needs.version.outputs.ref }}
        run: |
          set -euo pipefail
          cd dl
          index=latest.json; [ "$CHANNEL" = stable ] || index="$CHANNEL.json"
          extra=(); [ -f SHA256SUMS.sig ] && extra+=(SHA256SUMS.sig)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" InfantryAI-* SHA256SUMS "${extra[@]}" "$index" --clobber --repo "$GITHUB_REPOSITORY"
          elif [ "$CHANNEL" = stable ]; then
            gh release create "$TAG" InfantryAI-* SHA256SUMS "${extra[@]}" "$index" --repo "$GITHUB_REPOSITORY" \
              --title "Infantry AI ${TAG#v}" --generate-notes
          else
            # NIGHTLY-1: a PRERELEASE, never "latest" (Stable reads releases/latest). Creating it creates the tag on the built
            # commit; that tag is what the stable safety guard looks for.
            gh release create "$TAG" InfantryAI-* SHA256SUMS "${extra[@]}" "$index" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --prerelease --latest=false --title "Infantry AI ${TAG#v} ($CHANNEL)" --generate-notes
          fi

  # DOCKER-1: builds and pushes the headless daemon image. DISABLED until the owner adds the repo secrets
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN and sets the repo variable DOCKER_PUBLISH=true. Nothing is pushed before then.
  docker:
    # NIGHTLY-1: stable releases only (the image is tagged :latest).
    if: ${{ vars.DOCKER_PUBLISH == 'true' && needs.version.outputs.channel == 'stable' }}
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE || 'infantryai/infantry-ai' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      # NIGHTLY-1: a nightly builds a dev-branch commit that has no tag yet; name the branch so the packaging guard accepts it.
      - name: Name the dev branch (nightly)
        if: ${{ needs.version.outputs.channel != 'stable' }}
        shell: bash
        run: git checkout -q -B '${{ needs.version.outputs.branch }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # UPDATER-1: CI memory (the wasm production compile outgrew the 3 GB Kotlin daemon) and the official-plugin signing key:
      # the Infantry key from secrets INFANTRY_PLUGIN_KEYSTORE_BASE64 / INFANTRY_PLUGIN_KEY_ALIAS / IHQ_STOREPASS, else a
      # throwaway dev key with a warning (a test release only, like the debug APK fallback). $IHQ_SIGN goes on every gradlew.
      - name: CI Gradle memory and plugin signing
        shell: bash
        env:
          PLUGIN_KS_B64: ${{ secrets.INFANTRY_PLUGIN_KEYSTORE_BASE64 }}
          PLUGIN_KS_ALIAS: ${{ secrets.INFANTRY_PLUGIN_KEY_ALIAS }}
          IHQ_STOREPASS: ${{ secrets.IHQ_STOREPASS }}
        run: |
          set -euo pipefail
          gu="${GRADLE_USER_HOME:-$HOME/.gradle}"; mkdir -p "$gu"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\nkotlin.daemon.jvmargs=-Xmx4g\n' >> "$gu/gradle.properties"
          if [ -n "${PLUGIN_KS_B64:-}" ] && [ -n "${PLUGIN_KS_ALIAS:-}" ] && [ -n "${IHQ_STOREPASS:-}" ]; then
            printf '%s' "$PLUGIN_KS_B64" | base64 -d > "$RUNNER_TEMP/infantry-plugins.p12"
            echo "IHQ_SIGN=-Pihq.keystore=$RUNNER_TEMP/infantry-plugins.p12 -Pihq.alias=$PLUGIN_KS_ALIAS" >> "$GITHUB_ENV"
            echo "IHQ_STOREPASS=$IHQ_STOREPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No plugin signing secrets; official plugins are signed with a THROWAWAY dev key (test release only)."
            echo "IHQ_SIGN=-Pihq.devSign=true" >> "$GITHUB_ENV"
          fi
      - name: Build the Docker context
        run: ./gradlew --no-daemon :superiorSoftLibrary:infantry:dockerContext -PinfantryVersion='${{ needs.version.outputs.version }}' $IHQ_SIGN
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: superiorSoftLibrary/infantry/build/docker
          push: true
          build-args: INFANTRY_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
