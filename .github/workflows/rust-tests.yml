# SPDX-License-Identifier: Apache-2.0
# CI-TESTS-1: runs the guards, the protocol golden tests and the crate tests that pass reliably, so a red test fails CI
# (before this, "green" only meant it builds). No secrets, no signing, no release. Expected: ~25 min cold, ~8-12 min cached.
#
# CI-COVERAGE-1: the `workspace` job tests EVERY workspace member (lib, bins, integration tests incl. infantry-daemon
# tests/all and infantry-plugin-host tests/plugins.rs with the wasm32-wasip2 target installed), in parallel with the
# guards job. Nothing is skipped silently: a known-flaky or host-dependent test is named in KNOWN_FLAKY below, with why.
# infantry-guards runs in its own cargo invocation: built together with infantry-cli, serde_json's preserve_order feature
# is unified in and reference_docs_are_fresh sees a different key order (a guard bug, filed separately).
name: rust-tests

on:
  push:
    branches: [battalion-os, main]
    paths: ['rust/**', 'docs/wiki/reference/**', '.github/workflows/rust-tests.yml']
  pull_request:
    paths: ['rust/**', 'docs/wiki/reference/**', '.github/workflows/rust-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: false  # a ~25 min test run is never cancelled by a newer push; queued runs still collapse to the newest

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash, working-directory: rust } }
    env: { CARGO_BUILD_JOBS: '4', CARGO_TERM_COLOR: always }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, shared-key: rust-tests }
      - name: Guards (layers, rules, reference docs, bundled plugins, catalog)
        run: cargo test -p infantry-guards
      - name: Protocol golden + crate tests
        run: >-
          cargo test --no-fail-fast -p infantry-protocol -p infantry-board -p infantry-vault -p infantry-runner-pool
          -p infantry-scripting -p infantry-cli
      - name: Plugin host + daemon (lib only)
        run: cargo test --no-fail-fast -p infantry-plugin-host -p infantry-daemon --lib

  # Every workspace member except infantry-guards (own job above: serde_json preserve_order unification).
  workspace:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash, working-directory: rust } }
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: always
      # Known-flaky / host-dependent tests: none skipped yet. Add `--skip <path>` here only with a reason and evidence.
      # Locally-dependent (green on a clean runner, so kept running here):
      #   - role_plugin::other_roles_keep_their_text fails on the owner's machine (local state).
      #   - place_runner::a_session_pinned_to_a_runner_runs_there_and_a_stop_reaches_it fails inside a worker session
      #     ("wrong bearer") because INFANTRY_TOKEN/STATE_DIR/URL leak in; passes with them unset.
      # Measured 2026-11-27 on the owner's machine (warm target): whole workspace ~9 min.
      KNOWN_FLAKY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2 }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust, shared-key: rust-tests-workspace }
      - name: Whole workspace (integration tests included)
        run: cargo test --workspace --exclude infantry-guards --no-fail-fast -- $KNOWN_FLAKY
