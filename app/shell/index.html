<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Infantry AI</title>
    <style>
      html, body { background: #0e0f12; margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0e0f12; color: #e6e8ec; font: 600 18px system-ui, sans-serif; transition: opacity .2s; }
      #splash img { width: 96px; height: 96px; }
      #splash .bar { width: 140px; height: 3px; border-radius: 2px; background: #23262d; overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #6aa7ff; animation: splash-slide 1.1s ease-in-out infinite; }
      #splash .msg { font: 400 13px system-ui, sans-serif; color: #f08a7e; max-width: 80vw; text-align: center; }
      @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
  </head>

  <body>
    <div id="splash"><img src="/infantry-ai-emblem.png" alt="" /><span>Infantry AI</span><div class="bar"><i></i></div><div class="msg" id="splash-msg" hidden></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
