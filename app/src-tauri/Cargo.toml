[package]
name = "infantry-tauri"
version = "0.8.0"
description = "Infantry AI desktop shell (Tauri v2)"
authors = ["SuperiorSoft LLC"]
license = "Apache-2.0"
edition = "2024"


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infantry_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embed the built UI (shell/dist) and do NOT load devUrl. Tauri enables this for `tauri build`; a plain `cargo build` needs it
# explicitly or the window loads http://localhost:1420 ("localhost refused to connect"). Owner builds: scripts/rust-owner-build.ps1.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-websocket = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# WEBUI-1: daemon_http.rs reads the web UI plugin files the daemon serves, for the page (desktop and phone). Its TLS is
# rustls with the bundled web roots, so a phone needs no platform verifier.
ureq = { version = "2", default-features = false, features = ["tls"] }

# The desktop app starts the daemon sidecar or runs agents in its embedded runner; a phone does neither (RUST-MOBILE-1):
# it connects to a remote daemon only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
infantry-harness = { path = "../../rust/crates/infantry-harness" }
infantry-proc = { path = "../../rust/crates/infantry-proc" }
infantry-harness-claude = { path = "../../rust/crates/infantry-harness-claude" }
infantry-runner-local = { path = "../../rust/crates/infantry-runner-local" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# RUST-UPD-1: self-update from a signed feed, and the machine's addresses for phone pairing.
tauri-plugin-updater = "2"
# Ticket 1d57e853: the nightly channel reads GitHub's release list itself (the stable one is a plain manifest address).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
if-addrs = "0.13"

# Pairing by QR code (RUST-MOBILE-1).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Dev and test builds (`cargo build`, `cargo run`, `cargo test`; tests inherit `dev`): optimize the
# DEPENDENCIES only (wasmtime, SQLite, serde, tokio run 10-50x slower unoptimized). Workspace crates
# keep opt-level 0. BUILD-SPEED-1 (#78), same as rust/Cargo.toml: line tables only for this crate, no debug
# info for dependencies (the link time is mostly debug info). CARGO_PROFILE_DEV_DEBUG=full brings it back.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Quick build for owner checks (RUST-BUILD-SPEED-1); see rust/Cargo.toml. `release` stays the full build.
[profile.owner-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2
strip = false
