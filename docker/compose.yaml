# Infantry AI headless daemon: a single-host deployment. Slice 1 of the Docker design (ticket 2a0ac887).
#
#   1. Build the image once (see docker/README.md), or set INFANTRY_IMAGE to a published one.
#   2. mkdir -p secrets && openssl rand -hex 32 > secrets/infantry_token && openssl rand -hex 32 > secrets/infantry_keystore_key
#      (the files must be readable by uid 10001 inside the container: chmod 644, keep the directory private on the host)
#   3. cp docker/.env.example docker/.env   (edit), then:  docker compose -f docker/compose.yaml --env-file docker/.env up -d
#
# The daemon REFUSES to start without a token (non-loopback bind). Nothing secret is baked into the image or this file.
name: ${COMPOSE_PROJECT_NAME:-infantry-ai}

services:
  infantry-ai:
    image: ${INFANTRY_IMAGE:-infantryai/infantry-ai:dev}
    init: true                      # PID 1 reaps the zombies agent CLIs leave behind
    restart: unless-stopped
    ports:
      # Loopback only by default; put a TLS proxy (the `tls` profile, Tailscale) in front for remote use.
      - "${INFANTRY_BIND:-127.0.0.1}:${INFANTRY_HOST_PORT:-8787}:8787"
    environment:
      INFANTRY_TOKEN_FILE: /run/secrets/infantry_token
      INFANTRY_KEYSTORE_KEY_FILE: /run/secrets/infantry_keystore_key
      INFANTRY_REPO: ${INFANTRY_REPO:-/work/repo}
      INFANTRY_BASE_BRANCH: ${INFANTRY_BASE_BRANCH:-main}
      # Host name(s) the browser uses (comma separated), e.g. agents.example.com. Empty: the daemon's own addresses only.
      INFANTRY_WEB_HOSTS: ${INFANTRY_WEB_HOSTS:-}
      # --- Domains and URLs (DOMAIN-ENV-1, settings/EndpointRegistry.kt): empty = the built-in default. Moving the site,
      # the docs or the release files is an env change here, not a new image. See docs/wiki/Settings.md#domains-and-urls.
      INFANTRY_SITE_URL: ${INFANTRY_SITE_URL:-}
      INFANTRY_DOCS_URL: ${INFANTRY_DOCS_URL:-}
      INFANTRY_DOWNLOAD_URL: ${INFANTRY_DOWNLOAD_URL:-}
      INFANTRY_UPDATE_REPO: ${INFANTRY_UPDATE_REPO:-}
      INFANTRY_UPDATE_API: ${INFANTRY_UPDATE_API:-}
      INFANTRY_DOCKER_IMAGE: ${INFANTRY_DOCKER_IMAGE:-}
      # Health watchdog (ticket 55d60a5e): halts the daemon after FAILURES failed /health self-checks in a row so the restart
      # policy restarts it (Docker never restarts an unhealthy container). 0 = off. See docker-compose.yml.
      INFANTRY_LIMIT_HEALTH_WATCHDOG_FAILURES: ${INFANTRY_LIMIT_HEALTH_WATCHDOG_FAILURES:-3}
      # Harness credentials: pass through from the host environment / .env, never write them into this file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    secrets:
      - infantry_token
      - infantry_keystore_key
    volumes:
      - infantry-data:/data          # database, remote settings, keystore, harness-tools, memory: survives image upgrades
      - infantry-work:/work          # the git repository ticket worktrees are cut from (INFANTRY_REPO); unpushed branches live here
      - infantry-home:/home/infantry  # CLI logins (`docker compose exec infantry-ai claude`), npm cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${INFANTRY_MEM_LIMIT:-2g}
    # No docker.sock mount, ever: agents run code in this container, so the container is the sandbox.

  # Optional TLS in front (profile `tls`): docker compose --profile tls up -d. Needs INFANTRY_DOMAIN pointing at this host,
  # ports 80/443 open. Caddy gets and renews the certificate and passes WebSocket upgrades through.
  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    depends_on: [infantry-ai]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Required with --profile tls. Not `:?`: compose interpolates every service, so `:?` broke plain `up` (no tls).
      INFANTRY_DOMAIN: ${INFANTRY_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  infantry_token:
    file: ${INFANTRY_SECRETS_DIR:-./secrets}/infantry_token
  infantry_keystore_key:
    file: ${INFANTRY_SECRETS_DIR:-./secrets}/infantry_keystore_key

volumes:
  infantry-data:
  infantry-work:
  infantry-home:
  caddy-data:
  caddy-config:
