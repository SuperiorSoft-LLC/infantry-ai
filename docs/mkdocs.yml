site_name: Infantry AI
docs_dir: wiki
strict: true
use_directory_urls: false
theme:
  name: material
  features: [navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy]
  logo: assets/icon.png
  favicon: assets/icon.png
  font: {text: Inter, code: JetBrains Mono}
  palette:
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
extra_css: [stylesheets/extra.css]
repo_url: ""
edit_uri: ""
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Wiki index: index.md
  - Home: Home.md
  - Architecture: Architecture.md
  - Getting started: Plugins.md
  - Make a plugin: make-a-plugin.md
  - Plugin API: plugin-api.md
  - Daemon plugin API: daemon-plugin-api.md
  - Scripting and hooks: Scripting.md
  - Harnesses and providers: Harnesses.md
  - Settings: Settings.md
  - Licensing (draft): licensing.md
  - Recipes:
      - Overview: recipes/README.md
      - Add a UI panel plugin: recipes/add-ui-panel-plugin.md
      - Split into a child plugin: recipes/split-into-child-plugin.md
      - Add a daemon tool: recipes/add-daemon-tool.md
      - Add a setting with scopes: recipes/add-setting-with-scopes.md
      - Add a Lua hook: recipes/add-lua-hook.md
      - Add a CLI harness: recipes/add-cli-harness.md
      - Add a provider: recipes/add-provider.md
