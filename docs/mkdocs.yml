site_name: Infantry AI
docs_dir: wiki
strict: true
use_directory_urls: false
theme:
  name: material
  features: [navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy]
  logo: assets/icon.png
  favicon: assets/icon.png
  font: {text: Inter, code: JetBrains Mono}
  palette:
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
extra_css: [stylesheets/extra.css]
repo_url: ""
edit_uri: ""
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Install the desktop app: install-desktop.md
      - Install in BattalionOS: install-battalionos.md
      - First project and agent: first-project.md
      - Board and tickets: board-and-tickets.md
      - Providers and models: providers-and-models.md
  - User guide:
      - Mail and decisions: mail-and-decisions.md
      - Knowledge, scripting, settings, secrets: knowledge-scripting-settings.md
      - Phone app: phone.md
      - Services and Hosting: services-and-hosting.md
      - Remote runners: remote-runners.md
      - Runner in Docker: self-host-docker.md
  - Plugins:
      - Overview: plugins/overview.md
      - Create a plugin: plugins/create.md
      - Build and run: plugins/build.md
      - Configure: plugins/configure.md
      - Secrets: plugins/secrets.md
      - Endpoints: plugins/endpoints.md
      - UI pages: plugins/ui-pages.md
      - Daemon tools: plugins/daemon-tools.md
      - Publish: plugins/publish.md
      - Official plugins: plugins/official-plugins.md
  - BattalionOS apps: battalionos-apps.md
  - Reference:
      - CLI: reference/cli.md
      - MCP tools: reference/mcp-tools.md
      - Protocol: reference/protocol.md
      - Settings: reference/settings.md
      - Lua API: reference/lua-api.md
  - Contributing:
      - Architecture: contributing/architecture.md
      - Build and test: contributing/build-and-test.md
      - Test daemon: contributing/test-daemon.md
      - Add a harness: contributing/add-a-harness.md
      - Releasing: contributing/releasing.md
      - UI style: contributing/ui-style.md
      - Licensing: licensing.md
