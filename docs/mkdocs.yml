site_name: Infantry AI
docs_dir: wiki
strict: true
use_directory_urls: false
theme:
  name: material
  features: [navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy]
  logo: assets/icon.png
  favicon: assets/icon.png
  font: {text: Inter, code: JetBrains Mono}
  palette:
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
extra_css: [stylesheets/extra.css]
repo_url: ""
edit_uri: ""
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Install the desktop app: install-desktop.md
      - Install in BattalionOS: install-battalionos.md
      - First project and agent: first-project.md
      - Board and tickets: board-and-tickets.md
      - Providers and models: providers-and-models.md
  - User guide:
      - Mail and decisions: mail-and-decisions.md
      - Knowledge, scripting, settings, secrets: knowledge-scripting-settings.md
      - Phone app: phone.md
      - Services and Hosting: services-and-hosting.md
      - Remote runners: remote-runners.md
      - Runner in Docker: self-host-docker.md
  - Architecture: Architecture.md
  - Plugins: Plugins.md
  - Make a plugin: make-a-plugin.md
  - Plugin API: plugin-api.md
  - Daemon plugin API: daemon-plugin-api.md
  - Licensing (draft): licensing.md
  - Recipes:
      - Overview: recipes/README.md
      - Add a UI panel plugin: recipes/add-ui-panel-plugin.md
      - Split into a child plugin: recipes/split-into-child-plugin.md
      - Add a daemon tool: recipes/add-daemon-tool.md
      - Add a CLI harness: recipes/add-cli-harness.md
