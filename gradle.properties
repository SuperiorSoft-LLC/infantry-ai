#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# Append SSL args to your existing JVM args
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.configuration-cache=false
org.gradle.caching=true
# Add this to force fresh checks on your source code
org.gradle.parallel=true
# Re-enabled 2026-09-23. This was disabled 2026-09-14 on the theory that OneDrive's cloud-file
# filter driver was corrupting Gradle's native filesystem change notifications (continuous build
# silently serving 12h-stale bundles; --rerun-tasks producing different output than cached builds).
# That premise is false here: this path is only NAMED "OneDrive" -- OneDrive is not running and does
# not sync this folder, it is a plain local directory. Confirmed live 2026-09-23: with watching
# enabled, `:superPayload:devSsr --continuous` detects a source change and re-runs the client bundle
# build while the SSR server keeps running. Continuous build REQUIRES this; Gradle hard-fails with
# "Continuous build does not work when file system watching is disabled" otherwise. If this folder
# is ever actually synced again, set this back to false (and pass --no-watch-fs).
org.gradle.vfs.watch=true
kotlin.incremental.wasm=true
# JitPack Auth (Add this line)
android.useAndroidX=true
android.enableJetifier=true
kotlin.native.ignoreDisabledTargets=true
# Force Node version
kotlin.js.node.version=22.0.0
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.wasmjs=false
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.node.args=--max-old-space-size=12288
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
android.dependency.excludeLibraryComponentsFromConstraints=true
android.enableR8.fullMode=false


kotlin.js.incremental=false
kotlin.js.ir.incremental=false
kotlin.js.yarn.lockfile.auto.replace=true

# RELEASE-AUTO-1: the ONE release version (MAJOR.MINOR.BUILD). The desktop package, the APK versionName and the
# release workflow all read this; the pushed tag must be v<this>. Bump it, commit, then tag (docs/RELEASING.md).
infantryVersion=1.1.0

# VOICE-SEAM-1: the published UI plugin API (infantry-plugin-api) is <PLUGIN_API_VERSION>.<this>; a minor bump per
# additive SDK change (2.1.0 adds the speech.out and audio.in services). gradle/sdk-publish.gradle.kts reads it.
infantryPluginApiMinorPatch=1.0
