[versions]
composeMultiplatform = "1.10.3"
junit = "4.13.2"
kotlin = "2.3.10"
ktorClientCio = "3.2.3"
ktorClientCore = "3.4.1"
ktor = "3.4.1"
runner = "1.7.0"
serialization = "1.10.0"
kotlinx-coroutines = "1.10.2"
sqldelight = "2.2.1"
agp = "9.0.1"
androidx-activity = "1.12.4"
kotlinx-datetime = "0.7.1"
kotlinStdlib = "2.3.10"
junitVersion = "1.3.0"
zxing = "3.5.3"
# Desktop-only mp3 decoder (LGPL), used by JvmSoundPlayer alone; swap it there if the licence rules it out.
jlayer = "1.0.1.4"
mlkit-barcode = "17.3.0"
camerax = "1.4.2"

[libraries]
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorClientCore" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClientCore" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktorClientCore" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktorClientCio" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktorClientCio" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktorClientCio" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktorClientCio" }
primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-jdbc-driver = { group = "app.cash.sqldelight", name = "jdbc-driver", version.ref = "sqldelight" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# Ticket 55d60a5e: sqlite-driver 2.2.1 brings sqlite-jdbc 3.51.0.0, whose SQLite 3.51.0 deadlocks in the unix VFS
# (unixIsSharingShmNode takes the VFS mutex under the inode lock; fixed in 3.51.2). 3.51.3 also fixes WAL-reset corruption.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.51.3.0" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
jlayer = { module = "com.googlecode.soundlibs:jlayer", version.ref = "jlayer" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version = "2.2.1" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
