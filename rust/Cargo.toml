[workspace]
resolver = "2"
members = ["crates/*", "plugins/official/Infantry_Health/daemon", "plugins/official/Infantry_News", "plugins/official/Infantry_Notes", "plugins/official/Infantry_Mcp/daemon", "plugins/official/Infantry_Settings/daemon", "plugins/official/Infantry_Plugins/daemon", "plugins/official/Infantry_Chat/daemon", "plugins/official/Infantry_Docs/daemon", "plugins/official/Infantry_JobFeed/daemon", "plugins/official/Infantry_Cards/daemon", "plugins/official/Infantry_Git/daemon", "plugins/official/Infantry_Triggers/daemon"]

# Quick build for owner checks (RUST-BUILD-SPEED-1): no LTO, many codegen units, incremental.
# Real releases keep the full `release` profile. Build with `--profile owner-test`.
[workspace.package]
# The ONE version of the app, daemon, CLI and APK: the release bump edits this and tauri.conf.json + app/src-tauri/Cargo.toml.
version = "0.1.3"

[profile.owner-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2
