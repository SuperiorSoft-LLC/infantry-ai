[workspace]
resolver = "2"
members = ["crates/*", "plugins/official/Infantry_Health/daemon", "plugins/official/Infantry_News", "plugins/official/Infantry_Notes", "plugins/official/Infantry_Mcp/daemon", "plugins/official/Infantry_Settings/daemon", "plugins/official/Infantry_Plugins/daemon", "plugins/official/Infantry_Chat/daemon", "plugins/official/Infantry_Docs/daemon", "plugins/official/Infantry_JobFeed/daemon", "plugins/official/Infantry_Cards/daemon", "plugins/official/Infantry_Git/daemon", "plugins/official/Infantry_Triggers/daemon", "plugins/official/Infantry_Installer/daemon"]

# Quick build for owner checks (RUST-BUILD-SPEED-1): no LTO, many codegen units, incremental.
# Real releases keep the full `release` profile. Build with `--profile owner-test`.
[workspace.package]
# The ONE version of the app, daemon, CLI and APK: the release bump edits this and tauri.conf.json + app/src-tauri/Cargo.toml.
version = "0.5.1"

# Dev and test builds (`cargo build`, `cargo run`, `cargo test`; tests inherit `dev`): optimize the
# DEPENDENCIES only (wasmtime, SQLite, serde, tokio run 10-50x slower unoptimized). Workspace crates
# keep opt-level 0.
# BUILD-SPEED-1 (#78): debug info is what the dev link spends its time on (the daemon's PDB was 547 MB), so
# workspace crates keep line tables only (backtraces keep file:line; a debugger shows no locals) and dependencies
# get none. Measured: daemon edit 15 s -> 7 s, infantry-core edit 20 s -> 9.5 s, clean build 469 s -> 296 s.
# Full debug info for your own crates when you need a debugger: set CARGO_PROFILE_DEV_DEBUG=full.
# Release, owner-test and the MSI are not affected (docs/wiki/Build-speed.md).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.owner-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2
