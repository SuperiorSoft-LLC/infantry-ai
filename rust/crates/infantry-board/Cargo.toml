[package]
name = "infantry-board"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Infantry AI board (L4): tickets on the existing infantry.db schema, lane rules, the ticket_* FrameUnit and the in-process LocalOrchestrator. Becomes the Infantry_Board wasm plugin once the WIT storage SQL exists."
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
infantry-core = { path = "../infantry-core" }
infantry-protocol = { path = "../infantry-protocol" }
infantry-orchestrator-api = { path = "../infantry-orchestrator-api" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
