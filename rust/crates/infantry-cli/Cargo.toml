[package]
name = "infantry-cli"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Native `infantry mcp serve`: a drop-in for the Kotlin MCP stdio bridge (RUST-MCP-1)"
publish = false
build = "build.rs"

[[bin]]
name = "infantry"
path = "src/main.rs"

[[bin]]
name = "mcp-conformance"
path = "src/bin/mcp_conformance.rs"

[dependencies]
infantry-proc = { path = "../infantry-proc" }
# preserve_order: key order is kept exactly as the Kotlin bridge keeps it (kotlinx JsonObject is a LinkedHashMap).
# arbitrary_precision: a number is written back exactly as it was read, as kotlinx's JsonLiteral does.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
native-tls = "0.2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# RUST-CLI-1 runner: the local time of a stamp, and the runner-link keystore `runner list` / `detach` read.
infantry-vault = { path = "../infantry-vault" }
# RUST-CLI-1 ops: the usage DTOs and the one usage text renderer the daemon uses; timestamps as Kotlin prints them.
infantry-protocol = { path = "../infantry-protocol" }
infantry-usage = { path = "../infantry-usage" }
