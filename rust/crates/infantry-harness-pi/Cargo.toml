[package]
name = "infantry-harness-pi"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Infantry AI harness for the pi coding agent (one persistent pi --mode rpc per session, RPC JSON lines on stdin/stdout)"
publish = false

[dependencies]
infantry-harness = { path = "../infantry-harness" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
infantry-runner-local = { path = "../infantry-runner-local" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
