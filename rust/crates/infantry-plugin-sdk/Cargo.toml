[package]
name = "infantry-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry AI daemon plugin SDK: the daemon-plugin WIT bindings, a host facade and export_plugin! (WASM component or native sidecar)"
publish = false

[dependencies]
wit-bindgen = "0.57"
infantry-plugin-wit = { path = "../infantry-plugin-wit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
