[package]
name = "infantry-projects"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Infantry AI platform (L1): projects, workspaces, the project git view, session worktrees and ticket branches over the git CLI."
publish = false

[dependencies]
infantry-protocol = { path = "../infantry-protocol" }
infantry-core = { path = "../infantry-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
