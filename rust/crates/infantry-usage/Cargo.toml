[package]
name = "infantry-usage"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Infantry AI usage, limits and pacing (L1 platform): live plan meters, refresher backoff, usage-meter.db, the pacing judge, Pace forecast, overrides and the governor's workers-allowed answer"
publish = false

[dependencies]
infantry-protocol = { path = "../infantry-protocol" }
infantry-core = { path = "../infantry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
