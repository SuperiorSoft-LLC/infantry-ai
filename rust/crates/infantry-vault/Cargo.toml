[package]
name = "infantry-vault"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Infantry AI secrets vault (L1 platform): the keystore (Kotlin v1/v2 files), OS master-key protection, {{secret:...}} rendering, the output scrubber, Windows Hello reveal/copy, encrypted backup, the audit log and the secret_* frames"
publish = false

[dependencies]
infantry-protocol = { path = "../infantry-protocol" }
infantry-core = { path = "../infantry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"

[target.'cfg(unix)'.dependencies]
infantry-proc = { path = "../infantry-proc" }
