[package]
name = "infantry-health-daemon"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry_Health daemon half: the infantry_health tool (WASM component, or a native sidecar from the same code)"
publish = false

[lib]
name = "infantry_health_daemon"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "infantry-health-sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
infantry-plugin-sdk = { path = "../../../../crates/infantry-plugin-sdk" }
serde_json = "1"
