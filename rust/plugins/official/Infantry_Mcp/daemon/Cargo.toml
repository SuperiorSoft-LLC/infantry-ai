[package]
name = "infantry-mcp-daemon"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry_Mcp daemon half (WASM component, or a native sidecar from the same code)"
publish = false

[lib]
name = "infantry_mcp_daemon"
crate-type = ["cdylib", "rlib"]

[dependencies]
infantry-plugin-sdk = { path = "../../../../crates/infantry-plugin-sdk" }
serde_json = "1"


[dev-dependencies]
infantry-plugin-host = { path = "../../../../crates/infantry-plugin-host" }
infantry-plugin-wit = { path = "../../../../crates/infantry-plugin-wit" }
