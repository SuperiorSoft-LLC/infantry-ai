[package]
name = "infantry-notes"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Infantry_Notes daemon plugin (memory notes, decisions, issues), a WASM component"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
