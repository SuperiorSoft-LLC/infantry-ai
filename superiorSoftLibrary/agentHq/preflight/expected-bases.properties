# Expected base commit per AgentHQ branch, read by the `verifyBase` Gradle task.
#
# A branch's worktree MUST contain its expected base as an ancestor, or the build stops before
# any Kotlin is compiled (compileKotlin / compileTestKotlin depend on verifyBase).
#
# Format:  <branch>=<commit that must be an ancestor of HEAD>
#          <branch>=            (empty: this branch IS a base; nothing to verify)
#
# Rules:
#  - Declare the base explicitly, per phase. Never infer it from "the current tip".
#  - A branch with NO line here is NOT checked: verifyBase skips it with one log line (BUILD-VB-1,
#    so a fresh clone on `main` or a detached CI checkout builds). Declare every worker branch.
#  - When a phase lands on a branch, the next phase's line names that landed commit.
#

