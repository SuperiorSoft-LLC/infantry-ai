<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111}
/* The splash: plain HTML/CSS with the emblem inlined, so it paints before any other file arrives. */
#splash{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;background:#111;color:#bbb;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
  padding:24px;box-sizing:border-box;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(176px,40vw);height:auto;animation:breathe 2.4s ease-in-out infinite}
#splash .bar{width:min(220px,60vw);height:3px;border-radius:2px;background:#2a2a2a;overflow:hidden}
#splash .bar::before{content:"";display:block;width:40%;height:100%;border-radius:2px;background:#e53935;animation:slide 1.2s ease-in-out infinite}
#splash .err{display:none;max-width:460px}
#splash .err b{display:block;color:#ff8a80;font-size:17px;margin-bottom:6px}
#splash .err button{margin-top:14px;padding:8px 18px;border:1px solid #555;border-radius:6px;background:#222;color:#eee;font:inherit;cursor:pointer}
#splash .err button:hover,#splash .err button:focus-visible{border-color:#e53935}
#splash.failed .bar,#splash.failed .msg{display:none}
#splash.failed .err{display:block}
#splash.failed img{animation:none;filter:grayscale(.6);opacity:.7}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}#splash .bar::before{animation-duration:3s}#splash{transition:none}}
</style>
<noscript><style>#splash .bar,#splash .msg{display:none}</style></noscript>

<script>
// The splash leaves when the app has painted its first frame (Main.kt calls infantryReady()), or when a canvas exists
// after a while (the signal was missed). A script or wasm failure before that replaces the loader with a message.
(function () {
  var settled = false, started = Date.now();
  function el() { return document.getElementById('splash'); }
  function stop() { settled = true; clearInterval(watch); }
  window.infantryReady = function () {
    if (settled) return;
    stop();
    var s = el(); if (!s) return;
    s.classList.add('out');
    setTimeout(function () { s.remove(); }, 400);
  };
  function fail(detail) {
    if (settled) return;
    stop();
    var s = el(); if (!s) return;
    s.classList.add('failed');
    s.querySelector('.detail').textContent = detail;
    s.querySelector('button').focus();
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      fail('A file of the app did not load (' + (t.src || t.href || t.tagName) + '). The server or a network filter blocked it.');
    } else if (t === window || !t) {
      fail('Check the connection and reload. (' + String(e.message || e.error || 'Unknown error') + ')' + hint(e.error));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) { fail('Check the connection and reload. (' + String(e.reason && e.reason.message || e.reason) + ')' + hint(e.reason)); });
  function hint(err) {
    return err instanceof WebAssembly.CompileError || err instanceof WebAssembly.LinkError
      ? ' This browser may be too old for the app: use a current Chrome, Edge, Firefox or Safari.' : '';
  }
  var watch = setInterval(function () {
    var waited = Date.now() - started;
    if (waited > 15000 && hasCanvas()) window.infantryReady();
    else if (waited > 120000) fail('The app took more than two minutes to start. Check the connection and reload.');
  }, 1000);
  // Compose attaches a shadow root to <body>, which hides the body's own children: the splash lives under <html>.
  function hasCanvas() { var r = document.body && document.body.shadowRoot; return !!(r && r.querySelector('canvas')); }
})();
</script>
