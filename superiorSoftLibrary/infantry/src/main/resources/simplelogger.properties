# BUG-INSTALL-SLF4J-1: slf4j-simple, the daemon's (and in-process desktop's) one SLF4J provider.
#
# logFile=System.err with cacheOutputStream=false resolves System.err on EVERY call, so a line logged after
# infantryUi's InstallLogs.install has swapped System.err lands in <stateDir>/logs/infantry.log. Caching the stream
# would pin the console stream of first use and lose every line in the installed app.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.cacheOutputStream=false

# INFO, never DEBUG: Ktor's DEBUG/TRACE output can carry request details. No HTTP logging plugin (CallLogging,
# client Logging) is installed anywhere, so at INFO no header, token or Authorization value is written.
org.slf4j.simpleLogger.defaultLogLevel=info

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSZ
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false
